# Cloud detection: respond as Azure.
# The agent calls /usr/sbin/dmidecode (full path); the dmidecode shim under
# /usr/sbin and /usr/bin both forward to fakemall and resolve via these entries.
[[commands]]
matches = "dmidecode -s chassis-asset-tag"
output = "7783-7084-3265-9085-8269-3286-77"

[[commands]]
matches = "dmidecode -s system-manufacturer"
output = "Microsoft Corporation"

[[commands]]
matches = "dmidecode -s bios-vendor"
output = "Microsoft Corporation"

[[commands]]
matches = "dmidecode -s system-version"
output = "Hyper-V UEFI Release v4.1"

[[commands]]
matches = "dmidecode"
output = "Microsoft Corporation"

