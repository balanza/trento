  * Current DC: hana-s1-db1 (version 2.1.5+20221208.a3f44794f-150500.6.14.4-2.1.5+20221208.a3f44794f) - partition with quorum
  * Last updated: Fri Apr 17 09:52:40 2026
  * Last change:  Fri Apr 17 09:52:36 2026 by root via crm_attribute on hana-s1-db1
  * 3 nodes configured
  * 11 resource instances configured

Node List:
  * Online: [ hana-s-mm hana-s1-db1 hana-s2-db1 ]
"""

# crmadmin -qD: DC node name. cluster.GetState calls this and feeds the
# trimmed result back into `crmadmin -qS <node>` below.
[[commands]]
matches = "crmadmin -qD"
output = "hana-s1-db1"

# crmadmin -qS <node>: cluster state for the named node. The agent compares
# the trimmed output against the constant "S_IDLE" (cmdclient.go:idleState).
[[commands]]
matches = "crmadmin -qS hana-s1-db1"
output = "S_IDLE"
